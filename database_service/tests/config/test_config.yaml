# 测试环境配置
test_env:
  # Redis配置
  redis:
    url: "redis://localhost:6379/15"  # 使用测试数据库
    test_stream_prefix: "test_stream:"
    decode_responses: true
    
  # 数据库配置
  database:
    url: "postgresql://test:test@localhost:5432/test_db"
    pool_size: 5
    max_overflow: 10
    
  # AI服务配置
  ai_service:
    mock_mode: true  # 测试时使用mock
    mock_response_delay: 0.1  # 模拟延迟（秒）
    default_batch_size: 5
    
  # 测试数据配置
  test_data:
    news_count: 20
    max_title_length: 100
    max_content_length: 500
    
  # 性能测试配置
  performance:
    warmup_iterations: 3
    measurement_iterations: 10
    timeout_seconds: 30

# 测试用例配置
test_cases:
  # Redis测试用例
  redis:
    cleanup:
      test_group_patterns:
        - "test_.*"
        - "temp_.*"
        - "p2_.*"
      protected_groups:
        - "news_storage_handlers"
        - "theme_processors_v1"
        - "major_workers"
      max_group_age_hours: 24
      min_idle_time_minutes: 120
      
  # 错误处理测试用例
  error_handling:
    test_error_codes:
      - "REDIS-ERROR-001"
      - "DATABASE-WARNING-002"
      - "STREAM-ERROR-003"
      - "AI_SERVICE-ERROR-004"
      - "NETWORK-WARNING-005"
    severity_levels:
      - "DEBUG"
      - "INFO"
      - "WARNING"
      - "ERROR"
      - "CRITICAL"
      
  # AI处理测试用例
  ai_processing:
    batch_sizes: [1, 2, 3, 5, 10]
    concurrency_levels: [1, 2, 3, 5]
    performance_thresholds:
      single_item: 12.0  # 秒
      batch_improvement: 0.5  # 50%提升
      
  # Stream处理测试用例
  stream_processing:
    test_streams:
      - "test_stream:news"
      - "test_stream:themes"
    message_count: 100
    consumer_groups:
      - "test_consumer_group"
      
# 测试执行配置
test_execution:
  unit_tests:
    timeout: 30  # 秒
    parallel: true
    workers: 4
    
  integration_tests:
    timeout: 60  # 秒
    setup_timeout: 10
    teardown_timeout: 10
    
  performance_tests:
    duration: 300  # 秒
    users: 10
    spawn_rate: 1
    
# 测试报告配置
reporting:
  coverage:
    target: 80  # 目标覆盖率百分比
    exclude:
      - "*/migrations/*"
      - "*/tests/*"
      - "*/__pycache__/*"
      
  html_report: true
  xml_report: true
  json_report: true
  
# 环境变量覆盖
env_overrides:
  TEST_MODE: "true"
  LOG_LEVEL: "INFO"
  CACHE_ENABLED: "false"
