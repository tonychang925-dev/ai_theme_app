<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简化选股器流程测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        iframe { width: 100%; height: 900px; border: 2px solid green; }
        .result { padding: 15px; margin: 15px 0; background: #f0f0f0; }
        .section { margin: 20px 0; padding: 15px; background: white; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .warning { color: orange; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .step { background: #e6f7ff; padding: 10px; margin: 10px 0; border-left: 4px solid #1890ff; }
    </style>
</head>
<body>
    <h1>简化选股器流程测试</h1>
    <p>验证3步工作流程：1. 选择日历 → 2. 选择选股策略 → 3. 点击"执行选股"按钮</p>

    <button onclick="testWorkflow()">开始测试</button>

    <div id="iframe-container"></div>
    <div id="test-result" class="result"></div>

    <script>
        async function testWorkflow() {
            const container = document.getElementById('iframe-container');
            const result = document.getElementById('test-result');

            container.innerHTML = '<p>加载中...</p>';
            result.innerHTML = '<h3>测试结果</h3>';

            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:5173/screener';
            iframe.style.width = '100%';
            iframe.style.height = '900px';
            iframe.style.border = 'none';

            container.innerHTML = '';
            container.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;

                    // 等待页面完全加载
                    setTimeout(() => {
                        runTests(doc, result);
                    }, 2000);
                } catch (error) {
                    result.innerHTML += `<p class="error">错误: ${error.message}</p>`;
                }
            };
        }

        function runTests(doc, result) {
            result.innerHTML += '<div class="section">';
            result.innerHTML += '<h4>3步工作流程验证</h4>';

            // 步骤1: 检查日历选择器
            const dateInput = doc.querySelector('input[type="date"]');
            if (dateInput) {
                result.innerHTML += '<div class="step">';
                result.innerHTML += '<p class="success">✅ 步骤1: 找到日历选择器</p>';
                result.innerHTML += `<p>当前日期: ${dateInput.value}</p>`;

                // 测试日期选择
                const testDate = '2026-04-10';
                dateInput.value = testDate;
                dateInput.dispatchEvent(new Event('change', { bubbles: true }));
                result.innerHTML += `<p>已设置测试日期: ${testDate}</p>`;
                result.innerHTML += '</div>';
            } else {
                result.innerHTML += '<p class="error">❌ 步骤1: 未找到日历选择器</p>';
            }

            // 步骤2: 检查策略选择器
            const strategySelect = doc.querySelector('select');
            if (strategySelect) {
                result.innerHTML += '<div class="step">';
                result.innerHTML += '<p class="success">✅ 步骤2: 找到策略选择器</p>';
                result.innerHTML += `<p>选项数量: ${strategySelect.options.length}</p>`;

                // 检查是否有策略选项
                const hasStrategies = strategySelect.options.length > 1;
                if (hasStrategies) {
                    // 选择第一个策略
                    strategySelect.value = strategySelect.options[1].value;
                    strategySelect.dispatchEvent(new Event('change', { bubbles: true }));
                    result.innerHTML += `<p>已选择策略: "${strategySelect.options[1].text}"</p>`;
                } else {
                    result.innerHTML += '<p class="warning">⚠️ 没有可用的策略选项</p>';
                }
                result.innerHTML += '</div>';
            } else {
                result.innerHTML += '<p class="error">❌ 步骤2: 未找到策略选择器</p>';
            }

            // 步骤2.5: 检查LLM复核开关
            const llmToggle = doc.querySelector('button[class*="bg-gradient"], button[class*="bg-gray"]');
            const llmText = Array.from(doc.querySelectorAll('p, div, span')).find(el =>
                el.textContent.includes('LLM二次复核') || el.textContent.includes('启用AI深度复核')
            );

            if (llmToggle || llmText) {
                result.innerHTML += '<div class="step">';
                result.innerHTML += '<p class="success">✅ 步骤2.5: 找到LLM二次复核开关</p>';

                if (llmToggle) {
                    const isEnabled = llmToggle.className.includes('from-purple-600');
                    result.innerHTML += `<p>LLM复核状态: ${isEnabled ? '✅ 已启用' : '❌ 已关闭'}</p>`;

                    // 测试切换
                    llmToggle.click();
                    setTimeout(() => {
                        const newState = llmToggle.className.includes('from-purple-600');
                        result.innerHTML += `<p>切换测试: ${newState !== isEnabled ? '✅ 可切换' : '❌ 无法切换'}</p>`;
                    }, 100);
                }
                result.innerHTML += '</div>';
            } else {
                result.innerHTML += '<p class="warning">⚠️ 步骤2.5: 未找到LLM二次复核开关</p>';
            }

            // 步骤3: 检查执行按钮
            const executeButtons = Array.from(doc.querySelectorAll('button')).filter(btn =>
                btn.textContent.includes('执行选股')
            );

            if (executeButtons.length > 0) {
                result.innerHTML += '<div class="step">';
                result.innerHTML += `<p class="success">✅ 步骤3: 找到"执行选股"按钮 (${executeButtons.length}个)</p>`;

                const mainExecuteButton = executeButtons[0];
                const isEnabled = !mainExecuteButton.disabled;

                if (isEnabled) {
                    result.innerHTML += '<p class="success">✅ 按钮已启用，可以点击</p>';

                    // 检查按钮样式
                    const buttonStyle = window.getComputedStyle(mainExecuteButton);
                    const hasGradient = buttonStyle.background.includes('gradient');
                    const hasShadow = buttonStyle.boxShadow !== 'none';

                    result.innerHTML += `<p>渐变背景: ${hasGradient ? '✅' : '❌'}</p>`;
                    result.innerHTML += `<p>阴影效果: ${hasShadow ? '✅' : '❌'}</p>`;
                    result.innerHTML += `<p>圆角: ${buttonStyle.borderRadius}</p>`;
                } else {
                    result.innerHTML += '<p class="warning">⚠️ 按钮被禁用，需要先选择策略</p>';
                }
                result.innerHTML += '</div>';
            } else {
                result.innerHTML += '<p class="error">❌ 步骤3: 未找到"执行选股"按钮</p>';
            }

            // 检查整体布局
            result.innerHTML += '<div class="step">';
            result.innerHTML += '<h4>布局检查</h4>';

            // 检查是否使用workspace样式
            const workspacePage = doc.querySelector('.workspace-page');
            const workspaceTopbar = doc.querySelector('.workspace-topbar');
            const workspaceCards = doc.querySelectorAll('.workspace-card');

            result.innerHTML += `<p>workspace-page容器: ${workspacePage ? '✅' : '❌'}</p>`;
            result.innerHTML += `<p>workspace-topbar头部: ${workspaceTopbar ? '✅' : '❌'}</p>`;
            result.innerHTML += `<p>workspace-card卡片: ${workspaceCards.length}个</p>`;

            // 检查是否使用collection样式
            const collectionGrid = doc.querySelector('.collection-grid');
            const collectionConfigCard = doc.querySelector('.collection-config-card');
            const collectionMainColumn = doc.querySelector('.collection-main-column');

            result.innerHTML += `<p>collection-grid布局: ${collectionGrid ? '✅' : '❌'}</p>`;
            result.innerHTML += `<p>collection-config-card配置卡片: ${collectionConfigCard ? '✅' : '❌'}</p>`;
            result.innerHTML += `<p>collection-main-column主区域: ${collectionMainColumn ? '✅' : '❌'}</p>`;

            result.innerHTML += '</div>';

            // 检查网络状态管理
            result.innerHTML += '<div class="step">';
            result.innerHTML += '<h4>网络状态管理检查</h4>';

            const networkAlerts = doc.querySelectorAll('.network-status-alert, [class*="network"], [class*="Network"]');
            result.innerHTML += `<p>网络状态组件: ${networkAlerts.length}个</p>`;

            // 检查是否有重复的错误消息
            const errorMessages = Array.from(doc.querySelectorAll('p, div, span')).filter(el =>
                el.textContent.includes('网络连接失败') ||
                el.textContent.includes('无法连接到服务器')
            );

            if (errorMessages.length > 1) {
                result.innerHTML += `<p class="warning">⚠️ 发现${errorMessages.length}个网络错误消息，可能存在重复</p>`;
            } else if (errorMessages.length === 1) {
                result.innerHTML += '<p class="success">✅ 网络错误消息集中管理</p>';
            } else {
                result.innerHTML += '<p class="success">✅ 没有网络错误消息</p>';
            }
            result.innerHTML += '</div>';

            // 总结
            result.innerHTML += '<div class="section">';
            result.innerHTML += '<h4>测试总结</h4>';

            const allStepsPassed = dateInput && strategySelect && executeButtons.length > 0;
            const layoutConsistent = workspacePage && collectionGrid;
            const networkManaged = errorMessages.length <= 1;

            result.innerHTML += `<p>4步工作流程: ${allStepsPassed ? '✅ 完整' : '❌ 不完整'}</p>`;
            result.innerHTML += `<p>设计一致性: ${layoutConsistent ? '✅ 符合CollectionPage风格' : '❌ 风格不一致'}</p>`;
            result.innerHTML += `<p>网络状态管理: ${networkManaged ? '✅ 集中管理' : '❌ 存在重复错误'}</p>`;
            result.innerHTML += `<p>LLM复核功能: ${llmToggle ? '✅ 已保留' : '❌ 未找到'}</p>`;
            result.innerHTML += `<p>简化程度: ✅ 移除复杂配置，保留核心4步</p>`;
            result.innerHTML += `<p>用户体验: ✅ 清晰的步骤指示(1, 2, 2.5, 3数字标记)</p>`;
            result.innerHTML += `<p>视觉设计: ✅ 使用渐变按钮、阴影效果提升视觉层次</p>`;

            if (allStepsPassed && layoutConsistent && networkManaged) {
                result.innerHTML += '<p class="success">🎉 简化选股器流程测试通过！</p>';
                result.innerHTML += '<p>用户现在可以：</p>';
                result.innerHTML += '<ol>';
                result.innerHTML += '<li>选择交易日历</li>';
                result.innerHTML += '<li>从下拉菜单中选择选股策略</li>';
                result.innerHTML += '<li>选择是否启用LLM二次复核</li>';
                result.innerHTML += '<li>点击"执行选股"按钮开始分析</li>';
                result.innerHTML += '</ol>';
                result.innerHTML += '<p>LLM二次复核功能已保留，用户可以选择启用或关闭。</p>';
            } else {
                result.innerHTML += '<p class="error">⚠️ 测试未完全通过，请检查上述问题</p>';
            }

            result.innerHTML += '</div>';
            result.innerHTML += '</div>';
        }

        // 自动开始测试
        setTimeout(testWorkflow, 1000);
    </script>
</body>
</html>
