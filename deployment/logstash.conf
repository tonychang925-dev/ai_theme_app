# Logstash configuration for AI Theme App logs
input {
  # File input for application logs
  file {
    path => "/var/log/ai-theme-app/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }

  # TCP input for structured logs
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }

  # Add host information
  mutate {
    add_field => {
      "[@metadata][index]" => "ai-theme-app-%{+YYYY.MM.dd}"
    }
  }

  # Parse log level
  if [level] {
    mutate {
      add_field => {
        "log_level" => "%{level}"
      }
    }
  }

  # Parse service name from log file path
  if [path] {
    grok {
      match => { "path" => "/var/log/ai-theme-app/(?<service>[^/]+)\.log" }
    }
  }

  # Clean up fields
  mutate {
    remove_field => ["@version", "host", "path"]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }

  # Output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}