<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#f5f6f8"/>
  <text x="24" y="36" font-size="22" font-family="Arial" fill="#1f2937">Intel Wireframe - Interaction Flow</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280" />
    </marker>
  </defs>

  <rect x="60" y="100" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="78" y="136" font-size="14" font-family="Arial">左栏点击主题</text>
  <text x="78" y="160" font-size="12" font-family="Arial" fill="#6b7280">set selectedTheme</text>

  <rect x="520" y="100" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="538" y="136" font-size="14" font-family="Arial">中栏按 subject_key 过滤</text>

  <rect x="980" y="100" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="998" y="136" font-size="14" font-family="Arial">右栏刷新主题级验证</text>

  <line x1="420" y1="145" x2="520" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="145" x2="980" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="280" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="78" y="316" font-size="14" font-family="Arial">中栏点击事件</text>
  <text x="78" y="340" font-size="12" font-family="Arial" fill="#6b7280">set activeIntelItemId</text>

  <rect x="520" y="280" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="538" y="316" font-size="14" font-family="Arial">若含 stock_id</text>
  <text x="538" y="340" font-size="12" font-family="Arial" fill="#6b7280">set selectedStock</text>

  <rect x="980" y="280" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="998" y="316" font-size="14" font-family="Arial">右栏切换个股验证视图</text>

  <line x1="420" y1="325" x2="520" y2="325" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="325" x2="980" y2="325" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="460" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="78" y="496" font-size="14" font-family="Arial">日期切换</text>
  <text x="78" y="520" font-size="12" font-family="Arial" fill="#6b7280">set recapDate</text>

  <rect x="520" y="460" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="538" y="496" font-size="14" font-family="Arial">三栏并行刷新</text>

  <rect x="980" y="460" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="998" y="496" font-size="14" font-family="Arial">stream 回放/静态模式</text>

  <line x1="420" y1="505" x2="520" y2="505" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="505" x2="980" y2="505" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="640" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="78" y="676" font-size="14" font-family="Arial">SSE 异常</text>

  <rect x="520" y="640" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="538" y="676" font-size="14" font-family="Arial">stream_state = error</text>

  <rect x="980" y="640" width="360" height="90" rx="8" fill="#fff" stroke="#cfd8e3"/>
  <text x="998" y="676" font-size="14" font-family="Arial">自动 fallback 到 feed</text>

  <line x1="420" y1="685" x2="520" y2="685" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="685" x2="980" y2="685" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
