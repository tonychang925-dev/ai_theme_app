<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- 蓝青渐变 - 主要发光 -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- 金色渐变 - 点缀色 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 背景渐变 -->
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a15;stop-opacity:1" />
    </radialGradient>

    <!-- 图标卡片背景 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E2E;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#14141F;stop-opacity:0.95" />
    </linearGradient>
    
    <!-- 科技光晕 -->
    <radialGradient id="techGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="900" fill="#0a0a15"/>
  
  <!-- 顶部装饰线 -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.5"/>

  <!-- 标题 -->
  <text x="600" y="52" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#00D4FF" text-anchor="middle" font-weight="bold" letter-spacing="4">产品图标系统</text>
  <text x="600" y="82" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#666680" text-anchor="middle" letter-spacing="2">PRODUCT ICON SYSTEM</text>
  <line x1="300" y1="98" x2="900" y2="98" stroke="#2a2a3e" stroke-width="1"/>

  <!-- ==================== 第1行 ==================== -->
  
  <!-- 01 市场概览 -->
  <g transform="translate(80, 130)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <circle cx="90" cy="60" r="22" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <polyline points="72,60 82,50 90,58 108,40" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="60" r="5" fill="url(#cyanGrad)" opacity="0.8"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">市场概览</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Market Overview</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">01</text>
  </g>

  <!-- 02 题材挖掘 -->
  <g transform="translate(290, 130)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 放大镜 -->
    <circle cx="80" cy="52" r="14" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <line x1="90" y1="62" x2="104" y2="76" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 星星/火花 -->
    <polygon points="118,44 120,49 126,49 121,53 123,58 118,55 113,58 115,53 110,49 116,49" fill="url(#goldGrad)" opacity="0.9"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">题材挖掘</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Theme Mining</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">02</text>
  </g>

  <!-- 03 题材强度 -->
  <g transform="translate(500, 130)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 柱状图 -->
    <rect x="70" y="50" width="8" height="28" rx="2" fill="url(#cyanGrad)" opacity="0.7"/>
    <rect x="85" y="40" width="8" height="38" rx="2" fill="url(#cyanGrad)"/>
    <rect x="100" y="55" width="8" height="23" rx="2" fill="url(#cyanGrad)" opacity="0.5"/>
    <!-- 上升箭头 -->
    <polyline points="115,70 115,50 125,50" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115" y1="50" x2="125" y2="50" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <polygon points="127,47 125,53 122,50" fill="url(#goldGrad)"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">题材强度</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Theme Strength</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">03</text>
  </g>

  <!-- 04 资金流向 -->
  <g transform="translate(710, 130)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 箭头流 -->
    <path d="M70,50 L100,50 L100,70 L110,60" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="112,57 108,65 106,58" fill="url(#cyanGrad)"/>
    <path d="M110,78 L80,78 L80,58 L70,68" fill="none" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round"/>
    <polygon points="68,70 72,62 74,69" fill="#FF4D4D"/>
    <!-- 货币符号 -->
    <text x="95" y="50" font-family="sans-serif" font-size="10" fill="#00D4FF" opacity="0.6">¥</text>
    <text x="78" y="78" font-family="sans-serif" font-size="10" fill="#FF4D4D" opacity="0.6">$</text>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">资金流向</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Capital Flow</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">04</text>
  </g>

  <!-- ==================== 第2行 ==================== -->
  
  <!-- 05 个股分析 -->
  <g transform="translate(80, 320)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 折线图 + 圆点 -->
    <polyline points="65,75 78,55 92,65 105,45 118,50" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="55" r="3" fill="#00D4FF"/>
    <circle cx="105" cy="45" r="3" fill="#00D4FF"/>
    <!-- 文档 -->
    <rect x="65" y="40" width="20" height="24" rx="3" fill="none" stroke="#55556B" stroke-width="1.5"/>
    <line x1="69" y1="47" x2="81" y2="47" stroke="#55556B" stroke-width="1"/>
    <line x1="69" y1="52" x2="79" y2="52" stroke="#55556B" stroke-width="1"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">个股分析</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Stock Analysis</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">05</text>
  </g>

  <!-- 06 自选股 -->
  <g transform="translate(290, 320)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 星形 -->
    <polygon points="90,38 94,48 104,50 97,57 98,67 90,62 82,67 83,57 76,50 86,48" fill="url(#goldGrad)"/>
    <!-- 书签/列表 -->
    <rect x="78" y="55" width="24" height="28" rx="3" fill="none" stroke="#55556B" stroke-width="1.5"/>
    <line x1="82" y1="62" x2="96" y2="62" stroke="#55556B" stroke-width="1"/>
    <line x1="82" y1="68" x2="94" y2="68" stroke="#55556B" stroke-width="1"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">自选股</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Watchlist</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">06</text>
  </g>

  <!-- 07 策略回测 -->
  <g transform="translate(500, 320)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 齿轮 -->
    <circle cx="90" cy="60" r="12" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <circle cx="90" cy="60" r="5" fill="url(#cyanGrad)" opacity="0.8"/>
    <line x1="90" y1="44" x2="90" y2="38" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="76" x2="90" y2="82" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="74" y1="60" x2="68" y2="60" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="106" y1="60" x2="112" y2="60" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- 回放符号 -->
    <polygon points="118,48 128,55 118,62" fill="url(#cyanGrad)" opacity="0.6"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">策略回测</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Backtesting</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">07</text>
  </g>

  <!-- 08 资讯中心 -->
  <g transform="translate(710, 320)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 报纸/文档 -->
    <rect x="70" y="42" width="28" height="32" rx="3" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <line x1="74" y1="50" x2="92" y2="50" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <line x1="74" y1="56" x2="90" y2="56" stroke="#55556B" stroke-width="1.5"/>
    <line x1="74" y1="62" x2="94" y2="62" stroke="#55556B" stroke-width="1.5"/>
    <!-- 广播波 -->
    <path d="M102,52 Q108,60 102,68" fill="none" stroke="#55556B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M106,48 Q114,60 106,72" fill="none" stroke="#55556B" stroke-width="1.5" stroke-linecap="round"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">资讯中心</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">News Center</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">08</text>
  </g>

  <!-- ==================== 第3行 ==================== -->
  
  <!-- 09 数据中心 -->
  <g transform="translate(80, 510)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 数据库 -->
    <ellipse cx="90" cy="48" rx="16" ry="6" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <path d="M74,48 L74,68" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <path d="M106,48 L106,68" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <ellipse cx="90" cy="68" rx="16" ry="6" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <line x1="74" y1="58" x2="106" y2="58" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.5"/>
    <!-- 服务器 -->
    <rect x="82" y="72" width="16" height="4" rx="1" fill="#55556B"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">数据中心</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Data Center</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">09</text>
  </g>

  <!-- 10 系统设置 -->
  <g transform="translate(290, 510)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 六边形 - 品牌元素 -->
    <polygon points="90,42 108,52 108,71 90,81 72,71 72,52" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <!-- 滑块 -->
    <rect x="78" y="58" width="24" height="4" rx="2" fill="#55556B"/>
    <circle cx="96" cy="60" r="4" fill="url(#cyanGrad)"/>
    <!-- 齿轮小图标 -->
    <circle cx="90" cy="75" r="4" fill="none" stroke="#55556B" stroke-width="1.5"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">系统设置</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Settings</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">10</text>
  </g>

  <!-- 11 用户管理 -->
  <g transform="translate(500, 510)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 用户头像 -->
    <circle cx="90" cy="48" r="10" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
    <path d="M72,70 Q90,55 108,70" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- 多个用户 -->
    <circle cx="76" cy="72" r="4" fill="none" stroke="#55556B" stroke-width="1.5"/>
    <circle cx="104" cy="72" r="4" fill="none" stroke="#55556B" stroke-width="1.5"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">用户管理</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">User Management</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">11</text>
  </g>

  <!-- 12 实时采集 -->
  <g transform="translate(710, 510)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="60" rx="14" fill="#141420" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <!-- 天线/信号 -->
    <line x1="90" y1="38" x2="90" y2="60" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M78,48 Q90,42 102,48" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <path d="M74,58 Q90,48 106,58" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="3" fill="#00D4FF"/>
    <!-- 下载/采集箭头 -->
    <polyline points="82,72 90,80 98,72" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="62" x2="90" y2="80" stroke="url(#cyanGrad)" stroke-width="2"/>
    <text x="90" y="118" font-family="'PingFang SC',sans-serif" font-size="13" fill="#C8C8D8" text-anchor="middle">实时采集</text>
    <text x="90" y="138" font-family="'PingFang SC',sans-serif" font-size="10" fill="#55556B" text-anchor="middle">Real-time Data</text>
    <text x="12" y="20" font-family="monospace" font-size="10" fill="#333348">12</text>
  </g>

  <!-- ==================== 底部风格说明 ==================== -->
  <g transform="translate(40, 720)">
    <text x="0" y="0" font-family="'PingFang SC',sans-serif" font-size="11" fill="#00D4FF" opacity="0.8">风格特征</text>
    
    <!-- 5个特征标签 -->
    <rect x="0" y="15" width="90" height="28" rx="6" fill="#141420" stroke="#2a2a3e" stroke-width="1"/>
    <text x="45" y="34" font-family="'PingFang SC',sans-serif" font-size="10" fill="#8888A0" text-anchor="middle">线性几何</text>
    
    <rect x="100" y="15" width="90" height="28" rx="6" fill="#141420" stroke="#2a2a3e" stroke-width="1"/>
    <text x="145" y="34" font-family="'PingFang SC',sans-serif" font-size="10" fill="#8888A0" text-anchor="middle">科技光效</text>
    
    <rect x="200" y="15" width="90" height="28" rx="6" fill="#141420" stroke="#2a2a3e" stroke-width="1"/>
    <text x="245" y="34" font-family="'PingFang SC',sans-serif" font-size="10" fill="#8888A0" text-anchor="middle">品牌一致</text>
    
    <rect x="300" y="15" width="90" height="28" rx="6" fill="#141420" stroke="#2a2a3e" stroke-width="1"/>
    <text x="345" y="34" font-family="'PingFang SC',sans-serif" font-size="10" fill="#8888A0" text-anchor="middle">深色底板</text>
    
    <rect x="400" y="15" width="90" height="28" rx="6" fill="#141420" stroke="#2a2a3e" stroke-width="1"/>
    <text x="445" y="34" font-family="'PingFang SC',sans-serif" font-size="10" fill="#8888A0" text-anchor="middle">信息高效</text>

    <!-- 使用说明 -->
    <text x="0" y="70" font-family="'PingFang SC',sans-serif" font-size="11" fill="#00D4FF" opacity="0.8">使用说明</text>
    <circle cx="6" cy="86" r="2" fill="#55556B"/>
    <text x="14" y="90" font-family="'PingFang SC',sans-serif" font-size="10" fill="#666680">建议在深色背景或深色容器中使用</text>
    <circle cx="6" cy="104" r="2" fill="#55556B"/>
    <text x="14" y="108" font-family="'PingFang SC',sans-serif" font-size="10" fill="#666680">保持图标在原始比例下使用，避免变形</text>
    <circle cx="6" cy="122" r="2" fill="#55556B"/>
    <text x="14" y="126" font-family="'PingFang SC',sans-serif" font-size="10" fill="#666680">可根据状态需要使用微发光增强（hover/active）</text>
    <circle cx="6" cy="140" r="2" fill="#FFD700"/>
    <text x="14" y="144" font-family="'PingFang SC',sans-serif" font-size="10" fill="#FFD700" opacity="0.9">金色为点缀色，仅用于关键元素强调</text>
  </g>

  <!-- 右侧装饰六边形 -->
  <g transform="translate(1000, 740)" opacity="0.08">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="#00D4FF" stroke-width="0.5"/>
  </g>
</svg>