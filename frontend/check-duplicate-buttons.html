<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查重复按钮</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        iframe { width: 100%; height: 800px; border: 2px solid blue; }
        .result { padding: 15px; margin: 15px 0; background: #f0f0f0; }
        .duplicate { color: red; font-weight: bold; }
        .unique { color: green; }
    </style>
</head>
<body>
    <h1>检查重复按钮</h1>

    <button onclick="checkDuplicates()">检查重复</button>

    <div id="iframe-container"></div>
    <div id="check-result" class="result"></div>

    <script>
        async function checkDuplicates() {
            const container = document.getElementById('iframe-container');
            const result = document.getElementById('check-result');

            container.innerHTML = '<p>加载中...</p>';
            result.innerHTML = '检查中...';

            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:5173/';
            iframe.style.width = '100%';
            iframe.style.height = '800px';
            iframe.style.border = 'none';

            container.innerHTML = '';
            container.appendChild(iframe);

            iframe.onload = function() {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;

                    // 收集所有按钮文本
                    const allButtons = doc.querySelectorAll('button');
                    const buttonTexts = Array.from(allButtons).map(btn => btn.textContent.trim());

                    result.innerHTML = `<h3>找到 ${allButtons.length} 个按钮</h3>`;

                    // 找出重复的按钮文本
                    const textCount = {};
                    buttonTexts.forEach(text => {
                        textCount[text] = (textCount[text] || 0) + 1;
                    });

                    const duplicates = Object.entries(textCount)
                        .filter(([text, count]) => count > 1)
                        .map(([text, count]) => ({ text, count }));

                    // 显示所有按钮
                    result.innerHTML += '<h4>所有按钮：</h4>';
                    buttonTexts.forEach((text, i) => {
                        const isDuplicate = duplicates.some(d => d.text === text);
                        result.innerHTML += `<div class="${isDuplicate ? 'duplicate' : 'unique'}">
                            ${i+1}: "${text}" ${isDuplicate ? '(重复)' : ''}
                        </div>`;
                    });

                    // 显示重复的按钮
                    if (duplicates.length > 0) {
                        result.innerHTML += '<h4 class="duplicate">重复的按钮：</h4>';
                        duplicates.forEach(dup => {
                            result.innerHTML += `<div class="duplicate">
                                "${dup.text}" 出现了 ${dup.count} 次
                            </div>`;
                        });

                        // 找出重复按钮的位置
                        result.innerHTML += '<h4>重复按钮位置：</h4>';
                        duplicates.forEach(dup => {
                            const buttons = Array.from(allButtons).filter(btn =>
                                btn.textContent.trim() === dup.text
                            );

                            buttons.forEach((btn, i) => {
                                const parent = btn.closest('header, section, div');
                                const parentClass = parent ? parent.className : '未知';
                                const parentTag = parent ? parent.tagName : '未知';

                                result.innerHTML += `<div class="duplicate">
                                    "${dup.text}" #${i+1}: 在 ${parentTag}.${parentClass}
                                </div>`;
                            });
                        });
                    } else {
                        result.innerHTML += '<h4 class="unique">✅ 没有重复的按钮</h4>';
                    }

                    // 检查具体哪些按钮可能不需要
                    result.innerHTML += '<h4>按钮分析：</h4>';

                    // 检查Header区域的按钮
                    const headerButtons = Array.from(allButtons).filter(btn =>
                        btn.closest('.intel-topbar') || btn.closest('.collection-action-row')
                    );

                    result.innerHTML += `<p>Header区域按钮 (${headerButtons.length}个)：</p>`;
                    headerButtons.forEach(btn => {
                        result.innerHTML += `- "${btn.textContent.trim()}"<br>`;
                    });

                    // 检查Filter区域的按钮
                    const filterButtons = Array.from(allButtons).filter(btn =>
                        btn.closest('.intel-filters')
                    );

                    result.innerHTML += `<p>Filter区域按钮 (${filterButtons.length}个)：</p>`;
                    filterButtons.forEach(btn => {
                        result.innerHTML += `- "${btn.textContent.trim()}"<br>`;
                    });

                } catch (error) {
                    result.innerHTML = `错误: ${error.message}`;
                }
            };
        }

        // 自动检查
        setTimeout(checkDuplicates, 1000);
    </script>
</body>
</html>
