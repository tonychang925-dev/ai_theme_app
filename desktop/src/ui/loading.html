<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI投资助理</title>
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-card: rgba(255,255,255,0.04);
    --border-card: rgba(255,255,255,0.08);
    --gold: #c9a34d;
    --gold-dark: #b8860b;
    --text-primary: #c9ccd6;
    --text-secondary: #6a7088;
    --accent-green: #4caf91;
    --accent-red: #e06060;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle radial glow behind the card */
  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,163,77,0.08) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
  }

  /* Icon mark — a subtle diamond/gem shape */
  .brand-mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #1a1a2e;
    font-weight: 800;
    box-shadow: 0 8px 32px rgba(201,163,77,0.15);
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Progress indicator */
  .progress-track {
    width: 180px;
    height: 2px;
    margin: 0 auto 16px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
    border-radius: 2px;
    width: 0%;
    animation: progress 2.5s ease-in-out infinite;
  }

  @keyframes progress {
    0%   { width: 0%; }
    40%  { width: 45%; }
    70%  { width: 70%; }
    90%  { width: 88%; }
    100% { width: 88%; }
  }

  .status-text {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="container">
  <div class="brand-mark">AI</div>
  <h1 class="title">AI 投资助理</h1>
  <p class="subtitle">Investment Intelligence</p>
  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
  <p class="status-text"><span class="status-dot"></span>正在启动后端服务...</p>
</div>
</body>
</html>
