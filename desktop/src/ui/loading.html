<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI题材引擎 - 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0e1a;
    color: #dbe0ed;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  .container {
    text-align: center;
    padding: 40px;
  }
  .logo {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .title {
    font-size: 22px;
    font-weight: 800;
    color: #ffd700;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: #6a7088;
    margin-bottom: 28px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 16px;
    border: 3px solid rgba(255, 215, 0, 0.15);
    border-top-color: #ffd700;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 12px;
    color: #5a6078;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🛰️</div>
  <h1 class="title">AI题材引擎</h1>
  <p class="subtitle">正在启动后端服务...</p>
  <div class="spinner"></div>
  <p class="status">请稍候，首次启动可能需要 30 秒</p>
</div>
</body>
</html>
