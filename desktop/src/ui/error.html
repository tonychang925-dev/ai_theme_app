<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 投资助理 · 启动诊断</title>
<style>
  :root {
    --bg-deep: #00050e;
    --bg-card: #0d1a2d;
    --border-card: rgba(255,255,255,0.06);
    --cyan: #00ddfe;
    --blue: #3b95ff;
    --gold: #ffd26c;
    --text-primary: #e2e8f0;
    --text-secondary: #7a8498;
    --text-dim: #4a5568;
    --accent-green: #00c48c;
    --accent-red: #ef6a61;
    --accent-warn: #ffd26c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background:
      radial-gradient(ellipse 600px 300px at 50% 10%, rgba(0,221,254,0.03) 0%, transparent 70%),
      var(--bg-deep);
    color: var(--text-primary);
    padding: 32px 28px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .header { margin-bottom: 28px; }

  .title {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-red);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
  }

  .check-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 15px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 14px;
  }

  .check-pass { border-left: 3px solid var(--accent-green); }
  .check-fail { border-left: 3px solid var(--accent-red); }
  .check-warn { border-left: 3px solid var(--accent-warn); }

  .check-icon {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .check-pass .check-icon { background: rgba(0,196,140,0.1); color: var(--accent-green); }
  .check-fail .check-icon { background: rgba(239,106,97,0.1); color: var(--accent-red); }
  .check-warn .check-icon { background: rgba(255,210,108,0.1); color: var(--accent-warn); }

  .check-body { flex: 1; min-width: 0; }

  .check-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .check-message {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    word-break: break-word;
  }

  .check-hint {
    font-size: 11px;
    color: var(--cyan);
    margin-top: 6px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    background: rgba(0,221,254,0.04);
    padding: 7px 12px;
    border-radius: 8px;
    word-break: break-all;
    line-height: 1.5;
    border: 1px solid rgba(0,221,254,0.08);
  }

  .actions {
    margin-top: 28px;
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 11px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    letter-spacing: 0.2px;
    transition: opacity 0.15s ease;
  }

  .btn:active { opacity: 0.85; }

  .btn-primary {
    background: linear-gradient(135deg, #0d1a2d, #15233b);
    border: 1px solid rgba(0,221,254,0.15);
    color: var(--cyan);
    box-shadow: 0 2px 16px rgba(0,0,0,0.2);
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-card);
  }

  .footer-note {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .footer-note code {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    background: rgba(255,255,255,0.03);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1 class="title" id="diag-title">启动诊断</h1>
  <p class="subtitle">部分依赖未就绪，请根据提示修复后重试</p>
</div>

<ul class="check-list" id="check-list"></ul>

<div class="actions">
  <button class="btn btn-secondary" onclick="window.close()">关闭</button>
  <button class="btn btn-primary" onclick="window.location.reload()">重新检测</button>
</div>

<p class="footer-note">
  详细日志: <code>~/Library/Application Support/AI投资助理/logs/</code>
</p>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('diag-title').textContent = params.get('title') || '启动诊断';

  try {
    const checks = JSON.parse(params.get('checks') || '[]');
    const list = document.getElementById('check-list');
    checks.forEach(function(c) {
      const status = c.status === 'pass' ? 'check-pass' : c.status === 'warn' ? 'check-warn' : 'check-fail';
      const icon = c.status === 'pass' ? '✓' : c.status === 'warn' ? '!' : '✗';
      const li = document.createElement('li');
      li.className = 'check-item ' + status;
      li.innerHTML =
        '<span class="check-icon">' + icon + '</span>' +
        '<div class="check-body">' +
          '<div class="check-name">' + esc(c.name) + '</div>' +
          '<div class="check-message">' + esc(c.message) + '</div>' +
          (c.fixHint ? '<div class="check-hint">修复: ' + esc(c.fixHint) + '</div>' : '') +
        '</div>';
      list.appendChild(li);
    });
  } catch(e) {
    document.getElementById('check-list').innerHTML =
      '<li class="check-item check-fail"><span class="check-icon">✗</span>' +
      '<div class="check-body"><div class="check-name">诊断数据解析失败</div></div></li>';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
</script>
</body>
</html>
