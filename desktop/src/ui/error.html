<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI题材引擎 - 启动诊断</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0e1a;
    color: #dbe0ed;
    padding: 32px;
    min-height: 100vh;
  }
  .header {
    margin-bottom: 28px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    color: #e06060;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: #6a7088;
  }
  .check-list {
    list-style: none;
  }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
  }
  .check-icon {
    font-size: 18px;
    flex-shrink: 0;
    width: 24px;
    text-align: center;
  }
  .check-pass .check-icon { color: #5dade2; }
  .check-fail .check-icon { color: #e06060; }
  .check-warn .check-icon { color: #f0ad4e; }
  .check-body { flex: 1; }
  .check-name {
    font-size: 14px;
    font-weight: 600;
  }
  .check-message {
    font-size: 12px;
    color: #6a7088;
    margin-top: 2px;
  }
  .check-hint {
    font-size: 12px;
    color: #5dade2;
    margin-top: 4px;
    font-family: 'SF Mono', 'Menlo', monospace;
    word-break: break-all;
  }
  .actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
  }
  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #b8860b, #ffd700);
    color: #1a1a2e;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #dbe0ed;
    border: 1px solid rgba(255,255,255,0.12);
  }
</style>
</head>
<body>
<div class="header">
  <h1 class="title" id="diag-title">启动诊断 — 检测未通过</h1>
  <p class="subtitle">以下检查项未通过，请修复后重试。详细信息已写入日志。</p>
</div>
<ul class="check-list" id="check-list"></ul>
<div class="actions">
  <button class="btn btn-secondary" onclick="window.close()">关闭</button>
  <button class="btn btn-primary" onclick="window.location.reload()">重试</button>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get('title') || '启动诊断';
  document.getElementById('diag-title').textContent = title;

  try {
    const checks = JSON.parse(params.get('checks') || '[]');
    const list = document.getElementById('check-list');
    checks.forEach(function(c) {
      const status = c.status === 'pass' ? 'check-pass' : c.status === 'warn' ? 'check-warn' : 'check-fail';
      const icon = c.status === 'pass' ? '✓' : c.status === 'warn' ? '⚠' : '✗';
      const li = document.createElement('li');
      li.className = 'check-item ' + status;
      li.innerHTML =
        '<span class="check-icon">' + icon + '</span>' +
        '<div class="check-body">' +
          '<div class="check-name">' + c.name + '</div>' +
          '<div class="check-message">' + c.message + '</div>' +
          (c.fixHint ? '<div class="check-hint">修复: ' + c.fixHint + '</div>' : '') +
        '</div>';
      list.appendChild(li);
    });
  } catch(e) {
    document.getElementById('check-list').innerHTML = '<li class="check-item check-fail"><span class="check-icon">✗</span><div class="check-body">无法解析诊断结果</div></li>';
  }
</script>
</body>
</html>
