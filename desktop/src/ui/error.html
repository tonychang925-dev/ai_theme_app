<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI投资助理 · 启动诊断</title>
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-card: rgba(255,255,255,0.04);
    --border-card: rgba(255,255,255,0.08);
    --gold: #c9a34d;
    --gold-dark: #b8860b;
    --text-primary: #c9ccd6;
    --text-secondary: #6a7088;
    --accent-green: #4caf91;
    --accent-red: #e06060;
    --accent-warn: #d4a84b;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    padding: 28px 24px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    margin-bottom: 24px;
  }

  .title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-red);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }

  .check-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius);
    transition: border-color 0.15s ease;
  }

  .check-item.check-pass { border-left: 3px solid var(--accent-green); }
  .check-item.check-fail { border-left: 3px solid var(--accent-red); }
  .check-item.check-warn { border-left: 3px solid var(--accent-warn); }

  .check-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .check-pass .check-icon {
    background: rgba(76,175,145,0.12);
    color: var(--accent-green);
  }

  .check-fail .check-icon {
    background: rgba(224,96,96,0.12);
    color: var(--accent-red);
  }

  .check-warn .check-icon {
    background: rgba(212,168,75,0.12);
    color: var(--accent-warn);
  }

  .check-body { flex: 1; min-width: 0; }

  .check-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.2px;
  }

  .check-message {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 3px;
    word-break: break-word;
  }

  .check-hint {
    font-size: 11px;
    color: var(--gold);
    margin-top: 5px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    background: rgba(201,163,77,0.06);
    padding: 6px 10px;
    border-radius: 6px;
    word-break: break-all;
    line-height: 1.5;
  }

  .actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 10px 22px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    letter-spacing: 0.3px;
    transition: opacity 0.15s ease;
  }

  .btn:active { opacity: 0.8; }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: #1a1a2e;
    box-shadow: 0 2px 12px rgba(201,163,77,0.12);
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-card);
  }

  .footer-note {
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.2px;
  }

  .footer-note code {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    background: rgba(255,255,255,0.04);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1 class="title" id="diag-title">启动诊断</h1>
  <p class="subtitle">部分依赖未就绪，请根据提示修复后重试</p>
</div>

<ul class="check-list" id="check-list"></ul>

<div class="actions">
  <button class="btn btn-secondary" onclick="window.close()">关闭</button>
  <button class="btn btn-primary" onclick="window.location.reload()">重新检测</button>
</div>

<p class="footer-note">
  详细日志已写入 <code id="log-path">~/Library/Application Support/AI投资助理/logs/</code>
</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get('title') || '启动诊断';
  document.getElementById('diag-title').textContent = title;

  try {
    const checks = JSON.parse(params.get('checks') || '[]');
    const list = document.getElementById('check-list');
    checks.forEach(function(c) {
      const status = c.status === 'pass' ? 'check-pass'
        : c.status === 'warn' ? 'check-warn'
        : 'check-fail';
      const icon = c.status === 'pass' ? '✓'
        : c.status === 'warn' ? '!'
        : '✗';
      const li = document.createElement('li');
      li.className = 'check-item ' + status;
      li.innerHTML =
        '<span class="check-icon">' + icon + '</span>' +
        '<div class="check-body">' +
          '<div class="check-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="check-message">' + escapeHtml(c.message) + '</div>' +
          (c.fixHint ? '<div class="check-hint">' + escapeHtml(c.fixHint) + '</div>' : '') +
        '</div>';
      list.appendChild(li);
    });
  } catch(e) {
    document.getElementById('check-list').innerHTML =
      '<li class="check-item check-fail">' +
      '<span class="check-icon">✗</span>' +
      '<div class="check-body"><div class="check-name">诊断数据解析失败</div></div></li>';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
</script>
</body>
</html>
