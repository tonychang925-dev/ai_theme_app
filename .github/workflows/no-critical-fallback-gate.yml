name: NO_CRITICAL_FALLBACK_GATE

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  NO_CRITICAL_FALLBACK_GATE:
    name: NO_CRITICAL_FALLBACK_GATE
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact-SHA-bound NCF gate
        shell: bash
        run: |
          set -euo pipefail
          test -x tools/ncf/ncf_status_gate.py
          python3 tools/ncf/ncf_status_gate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --base-sha "${GITHUB_EVENT_PULL_REQUEST_BASE_SHA}" \
            --head-sha "${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA}" \
            --github-sha "${GITHUB_SHA}" | tee ncf-findings.json
          test "$(jq -r '.candidate_sha' ncf-findings.json)" = "${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA}"
          test "$(jq -r '.finding_count' ncf-findings.json)" = "0"
