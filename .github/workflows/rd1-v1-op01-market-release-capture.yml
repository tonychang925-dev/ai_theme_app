name: RD1-V1 OP01 Market Release Capture

on:
  workflow_dispatch:
    inputs:
      integration_commit:
        description: Exact frozen integration commit F
        required: true
        type: string

permissions:
  attestations: write
  id-token: write
  contents: write

jobs:
  capture:
    name: Frozen external capture producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_REPOSITORY: tonychang925-dev/ai_theme_app
      EXPECTED_ACTOR: tonychang925-dev
      EXPECTED_EVENT: workflow_dispatch
      EXPECTED_F: a05661db2f111052cc4d9c55e8eb60ed5b1f4e80
      RELEASE_TAG: rd1-v1/op01/market-product-read/v1
    steps:
      - name: Validate dispatch authority before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_ACTOR}" = "${EXPECTED_ACTOR}"
          test "${GITHUB_TRIGGERING_ACTOR}" = "${EXPECTED_ACTOR}"
          test "${GITHUB_EVENT_NAME}" = "${EXPECTED_EVENT}"
          test "${ImageOS}" = "ubuntu24"
          test "${GITHUB_WORKFLOW_REF#refs/heads/rd1-v1/op01/capture-producer@}" != "${GITHUB_WORKFLOW_REF}"
          test "${INTEGRATION_COMMIT}" = "${EXPECTED_F}"
        env:
          INTEGRATION_COMMIT: ${{ inputs.integration_commit }}

      - name: Check out exact frozen producer workflow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: producer-workflow
          persist-credentials: false

      - name: Check out exact frozen source F
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.integration_commit }}
          fetch-depth: 0
          submodules: false
          path: source
          persist-credentials: false

      - name: Fail closed if release tag already exists
        shell: bash
        run: |
          set -euo pipefail
          if git -C source ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}"; then
            echo "frozen release tag already exists" >&2
            exit 1
          fi

      - name: Build canonical capture inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 producer-workflow/.github/scripts/op01_capture_producer.py \
            --integration-commit "${INTEGRATION_COMMIT}" \
            --workflow-root producer-workflow \
            --source-root source \
            --output-root capture-output
        env:
          INTEGRATION_COMMIT: ${{ inputs.integration_commit }}

      - name: Attest exact capture transaction bytes
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: capture-output/capture-transaction.json
          push-to-registry: false

      - name: Freeze detached Sigstore bundle asset
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BUNDLE_PATH}"
          test "$(basename "${BUNDLE_PATH}")" != "capture-transaction.sigstore.json"
          cp "${BUNDLE_PATH}" capture-output/capture-transaction.sigstore.json
          jq -e . capture-output/capture-transaction.sigstore.json >/dev/null
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}

      - name: Validate exact output layout and modes
        shell: bash
        run: |
          set -euo pipefail
          expected='artifact.bin
          capture-transaction.sigstore.json
          capture-transaction.json
          manifest.json'
          actual="$(find capture-output -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "${actual}" = "$(printf '%s\n' "${expected}" | sort)"
          find capture-output -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q . && exit 1 || true
          stat -c '%a %n' capture-output/* | sort > actual-modes.txt
          printf '644 capture-output/artifact.bin\n644 capture-output/capture-transaction.sigstore.json\n644 capture-output/capture-transaction.json\n644 capture-output/manifest.json\n' | sort > expected-modes.txt
          diff -u expected-modes.txt actual-modes.txt

      - name: Publish exactly four frozen assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${EXPECTED_F}" \
            --title "RD1-V1 Market Product Read Capture" \
            --notes "OP01-A frozen external capture. Verification is required before consumption." \
            capture-output/manifest.json \
            capture-output/artifact.bin \
            capture-output/capture-transaction.json \
            capture-output/capture-transaction.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
